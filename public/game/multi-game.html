<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>鲨鱼之王 - 多账号</title>
    <meta
      name="viewport"
      content="width=device-width,user-scalable=no,initial-scale=1, minimum-scale=1,maximum-scale=1"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="renderer" content="webkit" />
    <meta name="force-rendering" content="webkit" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta name="full-screen" content="yes" />
    <meta name="x5-fullscreen" content="true" />
    <meta name="360-fullscreen" content="true" />
    <meta name="screen-orientation" content="portrait" />
    <meta name="x5-orientation" content="portrait" />
    <meta name="x5-page-mode" content="app" />
    <link rel="stylesheet" type="text/css" href="style-mobile.1777a.css" />
    <link rel="icon" href="favicon.8de18.ico" />
    <style>
      /* 上号器面板（#binTool）承担 BIN 注入登录，多开窗口里必须保留它运行，
         但用不到它的界面：出现即自动折叠，折叠完成后彻底隐藏。
         需要手动操作上号器时，在窗口地址追加 bin-tool=show 即可恢复显示。 */
      #binTool:not([data-mg-auto-collapsed="1"]) {
        visibility: hidden !important;
      }
      #binTool[data-mg-auto-collapsed="1"] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <canvas
      id="GameCanvas"
      oncontextmenu="event.preventDefault()"
      tabindex="0"
    ></canvas>
    <div id="splash">
      <div class="progress-bar stripes">
        <span style="width: 0%"></span>
      </div>
    </div>

    <script src="multi-game-storage-bridge.js" charset="utf-8"></script>
    <script type="text/javascript">
      (function loadMultiGameRuntime() {
        "use strict";

        if (!window.__MULTI_GAME_BRIDGE_READY__) return;

        // 与 public/game/index.html 保持一致的运行时加载顺序；
        // sh1.readable.js 由 push-level-research-bridge.js 动态注入。
        const runtime = [
          "patch.decrypted_readable.js",
          "src/settings.da7ef.js",
          "game-defines.a175e.js",
          "platform-spoof.js?v=20260916.2",
          // 首帧口径改写（3000070 归因验证）：必须在游戏逻辑建连前 hook WebSocket.prototype.send
          "first-frame-spoof.js?v=20260921.1",
          "main.2a00e.js",
          "cocos2d-js-min.a5841.js",
          "xh.js",
          "diagnose_require.js",
          "push-level-research-bridge.js?v=20260907.13",
        ];
        const loadScript = (src) =>
          new Promise((resolve, reject) => {
            const script = document.createElement("script");
            script.src = src;
            script.charset = "utf-8";
            script.onload = resolve;
            script.onerror = () => reject(new Error(`Unable to load ${src}`));
            document.head.appendChild(script);
          });
        const notify = (type, code) => {
          const { scope } = window.__MULTI_GAME_BRIDGE_READY__;
          window.parent.postMessage(
            {
              channel: "multi-game",
              version: 1,
              type,
              scope,
              ...(code ? { code } : {}),
            },
            window.location.origin,
          );
        };

        // 上号器面板在多开窗口里只承担 BIN 注入，界面本身用不上；但它由 sh1.js
        // （用户脚本运行时）异步挂载，静态时序上点不到按钮，所以监听 DOM，
        // 等它一出现就折叠（保留 DOM 与登录注入逻辑，仅让界面不可见）。
        // 需要手动操作上号器时，在窗口地址追加 bin-tool=show。
        const accountToolVisible =
          new URLSearchParams(window.location.search).get("bin-tool") ===
          "show";
        const autoCollapseAccountTool = () => {
          if (accountToolVisible) return;
          const collapse = () => {
            const panel = document.getElementById("binTool");
            if (!panel) return false;
            if (panel.dataset.mgAutoCollapsed === "1") return true;
            panel.dataset.mgAutoCollapsed = "1";
            const minimizeButton = document.getElementById("minimizeBtn");
            if (minimizeButton) minimizeButton.click();
            else panel.classList.add("minimized");
            return true;
          };
          if (collapse()) return;
          const observer = new MutationObserver(() => {
            if (collapse()) observer.disconnect();
          });
          observer.observe(document.documentElement, {
            childList: true,
            subtree: true,
          });
          setTimeout(() => observer.disconnect(), 60000);
        };

        (async () => {
          autoCollapseAccountTool();
          for (const src of runtime) await loadScript(src);
          window.HtmlIsLoaded = true;
          document.getElementById("splash").style.display = "none";
          if (window.__pushResearchSh1Ready) await window.__pushResearchSh1Ready;
          await window.boot();
          await loadScript("salt-field-auto.js?v=20260911.1");
          await loadScript("multi-game-control-bridge.js?v=20260911.1");
          await loadScript("multi-game-sync-bridge.js?v=20260915.2");
          notify("ready");
        })().catch(() => {
          document.getElementById("splash").textContent = "游戏资源加载失败";
          notify("fatal", "runtime-load-failed");
        });
      })();
    </script>
  </body>
</html>
