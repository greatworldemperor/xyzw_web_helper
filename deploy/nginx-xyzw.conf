# xyzw_web_helper — 服务器 nginx 站点配置
#
# 线上位置：/etc/nginx/conf.d/xyzw.conf  （OpenCloudOS/RHEL 风格，无 sites-available/enabled）
# 站点根：  /opt/xyzw_web_helper/dist      （即 git 仓库里的构建产物，原地生效）
# 依赖：    该 server 块内含 4 个 /api 反代（微信扫码/微信登录/手机号验证码/Hortor登录），
#           如替换本文件务必保留这些 location，否则线上接口会失效。
#
# 生效：    cp 到 /etc/nginx/conf.d/xyzw.conf 后执行 nginx -t && systemctl reload nginx
#
# ── 缓存策略说明（2026-09-12 根治「批量打开任务失败」）────────────────────────
# 背景：vite 构建产物带内容哈希（assets/xxx-<hash>.js），每次部署 manifest 变化。
#       若用户浏览器还在跑旧 index.html / 旧 chunk，会按旧哈希去请求已被删除的文件。
#       原先的 `location / { try_files $uri $uri/ /index.html; }` 对 /assets/* 同样命中，
#       导致缺失的 JS 被回退成 index.html —— 浏览器拿到 200 + text/html，
#       把它当 ES module 解析失败，抛出
#         TypeError: Failed to fetch dynamically imported module
#       用户侧表现为「批量打开运行时失败」，且必须手动刷新才恢复。
# 对策：1) /assets/ 下的缺失文件返回真正的 404，不再伪装成 HTML（快速失败，语义正确）
#       2) index.html 强制不缓存，保证每次访问都拿到最新入口与最新 chunk 清单
#       3) 带哈希的静态资源长缓存 immutable（文件名即版本，内容永不变）
#
# ── [h5web-proxy] 官方 H5 实时反代（2026-10-06 路线①）────────────────────────
# 目的：官方现行 H5（xxz-xyzw-res.hortorgames.com/h5web/）反代到本站 /h5web-proxy/，
#       HTML 注入本地镜像同款辅助脚本（同源=注入有效），版本永远自动跟随官方周更。
# 语义与 scripts/h5web-inject.mjs / worker.js 内联副本保持同步（锚点=main.2a00e.js 标签）。
# 红线：只代理静态资源；游戏 WS（wss://xxz-xyzw-new…）与 authuser 登录由浏览器直连官方，
#       每用户出口 IP=自己 —— 全员流量过服务器 = 单 IP 秒限流 + 封号风险，绝不反代协议。
# 缓存：不可变 hash 资源 proxy_cache（上游 CDN 每文件只见 1 次）；HTML 不缓存且 no-cache 下发。

# [h5web-proxy] 缓存区与内容型缓存策略（conf.d 在 http 上下文内）
proxy_cache_path /var/cache/nginx/h5web levels=1:2 keys_zone=h5web_static:10m max_size=1g inactive=7d use_temp_path=off;
map $upstream_http_content_type $h5web_cache_ctl {
    default "public, max-age=31536000, immutable";
    ~text/html "no-cache";
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /opt/xyzw_web_helper/dist;
    index index.html;

    # 微信扫码状态轮询代理
    location /api/weixin-long/ {
        proxy_pass https://long.open.weixin.qq.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host long.open.weixin.qq.com;
        proxy_set_header Referer "https://open.weixin.qq.com/";
        proxy_set_header User-Agent "Mozilla/5.0 (Linux; Android 7.0; Mi-4c Build/NRD90M; wv) AppleWebKit/537.36 (KHTML, like Gecko) Version/4.0 Chrome/53.0.2785.49 Mobile Safari/537.36 MicroMessenger/6.6.1.1220(0x26060135) NetType/WIFI Language/zh_CN";
        proxy_set_header Accept "*/*";
        proxy_set_header Connection "keep-alive";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 微信登录接口代理
    location /api/weixin/ {
        proxy_pass https://open.weixin.qq.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host open.weixin.qq.com;
        proxy_set_header Referer "https://open.weixin.qq.com/";
        proxy_set_header User-Agent "Mozilla/5.0 (Linux; Android 7.0; Mi-4c Build/NRD90M; wv) AppleWebKit/537.36 (KHTML, like Gecko) Version/4.0 Chrome/53.0.2785.49 Mobile Safari/537.36 MicroMessenger/6.6.1.1220(0x26060135) NetType/WIFI Language/zh_CN";
        proxy_set_header Accept "text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8";
        proxy_set_header Connection "keep-alive";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 手机号验证码接口代理
    location /api/hortor-ucenter/ {
        proxy_pass https://ucenter-app-server.hortorgames.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host ucenter-app-server.hortorgames.com;
        proxy_set_header Referer "https://open.weixin.qq.com/";
        proxy_set_header User-Agent "Mozilla/5.0 (Linux; Android 12; Web Login Build/V417IR; wv) AppleWebKit/537.36 (KHTML, like Gecko) Version/4.0 Chrome/110.0.5481.154 Mobile Safari/537.36";
        proxy_set_header Accept "application/json";
        proxy_set_header Connection "keep-alive";
        proxy_set_header Content-Type "application/json; charset=utf-8";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hortor登录接口代理
    location /api/hortor/ {
        proxy_pass https://comb-platform.hortorgames.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host comb-platform.hortorgames.com;
        proxy_set_header Origin "https://open.weixin.qq.com";
        proxy_set_header Referer "https://open.weixin.qq.com/";
        proxy_set_header User-Agent "Mozilla/5.0 (Linux; Android 12; 23117RK66C Build/V417IR; wv) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/95.0.4638.74 Mobile Safari/537.36";
        proxy_set_header Accept "*/*";
        proxy_set_header Connection "keep-alive";
        proxy_set_header Content-Type "text/plain; charset=utf-8";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── [h5web-proxy] 官方 H5 实时反代（路线①）─────────────────────────────
    # 桥内相对路径加载的 sha1 库在反代页解析到 /h5web-proxy/ 下（官方没有）→ 映射到本地镜像 /game/
    # （= 精确匹配，优先于一切；SHA256 无需正则）
    location = /h5web-proxy/sh1.js {
        root /opt/xyzw_web_helper/dist;
        try_files /game/sh1.js =404;
        add_header Cache-Control "public, max-age=86400" always;
        access_log off;
    }
    location = /h5web-proxy/sh1.readable.js {
        root /opt/xyzw_web_helper/dist;
        try_files /game/sh1.readable.js =404;
        add_header Cache-Control "public, max-age=86400" always;
        access_log off;
    }

    # /h5web-proxy/* → 官方 /h5web/*；HTML 注入辅助脚本（单锚点，见 scripts/h5web-inject.mjs）；
    # 注入脚本从本站 /game/*（本地镜像）加载 —— 同源。
    # 🔴 必须 ^~：压制站点级 .json/.png 等正则 location —— 否则 Cocos 资源
    #    （assets/**/config.*.json 等）被正则抢走走 try_files → 404（10-06 首测二坑）。
    location ^~ /h5web-proxy/ {
        proxy_pass https://xxz-xyzw-res.hortorgames.com/h5web/;
        proxy_ssl_server_name on;
        proxy_set_header Host xxz-xyzw-res.hortorgames.com;
        proxy_set_header Accept-Encoding "";
        proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_cache h5web_static;
        proxy_cache_valid 200 7d;
        proxy_cache_use_stale error timeout updating;
        proxy_cache_key "$scheme$request_method$host$uri$is_args$args";

        sub_filter_types text/html;
        sub_filter_once on;
        # 单锚点 = 完整 main 标签（nginx sub_filter 多规则锚点重叠会被抑制，故单规则一次注入 A+main+B）
        sub_filter '<script src="main.2a00e.js" charset="utf-8"></script>' '<script>window.GAME_ID="xyzw_mix";</script><script src="/game/platform-spoof.js?v=20260916.2" charset="utf-8"></script><script src="/game/first-frame-spoof.js?v=20260921.1" charset="utf-8"></script><script>/* [h5web-proxy] boot-shim: official boot waits for bridge sha1 ready (same as local mirror) */(function(){var _b=null;try{Object.defineProperty(window,"boot",{configurable:true,get:function(){if(!_b)return void 0;return function(){var a=arguments,s=this;var go=function(){_b.apply(s,a)};Promise.resolve(window.__pushResearchSh1Ready||!0).then(go,go);}},set:function(v){_b=v}})}catch(e){}})();</script><script src="main.2a00e.js" charset="utf-8"></script><script src="/game/runtime-tweaks.js?v=20261002.3" charset="utf-8"></script><script src="/game/xh.js" charset="utf-8"></script><script src="/game/diagnose_require.js" charset="utf-8"></script><script src="/game/push-level-research-bridge.js?v=20260907.13" charset="utf-8"></script>';

        # HTML 不缓存（浏览器侧也 no-cache）；不可变资源长缓存
        proxy_hide_header Cache-Control;
        add_header Cache-Control $h5web_cache_ctl always;
        add_header X-H5Web-Proxy "1" always;
        access_log off;
    }

    # ── 静态资源：带内容哈希，可永久强缓存 ──────────────────────────────
    # 缺失文件直接 404，不再回退 index.html（这是本次根治的关键）
    location /assets/ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── 入口 HTML：绝不缓存，保证每次拿到最新 chunk 清单 ────────────────
    # 使用 expires -1：nginx 会输出 `Expires: <过去时间>` + `Cache-Control: no-cache`，
    # 再手动补 Pragma 兼容老浏览器。不要额外 add_header Cache-Control，否则头会重复。
    location = /index.html {
        expires -1;
        add_header Pragma "no-cache";
    }

    # ── 其余路径：SPA 路由回退（仅对无后缀的页面路径生效）──────────────
    # 注意：内部回退到 /index.html 时会叠加 location = /index.html 的 add_header，
    #       故此处不再重复设置 Cache-Control，避免出现两行冲突的响应头。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 顶层静态文件（favicon/图标/manifest 等），未命中仍走 SPA 回退
    location ~* \.(?:png|jpe?g|gif|svg|webp|ico|woff2?|ttf|eot|json|txt|webmanifest)$ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=86400";
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
    }
}
